name: Connector regression tests

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.20.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: LibreLinkUp factory times in different host timezones
        run: |
          TZ=Europe/London node --test test/librelinkup*.test.js
          TZ=America/New_York node --test test/librelinkup*.test.js
          TZ=Asia/Tokyo node --test test/librelinkup*.test.js

  librelinkup-nightscout:
    name: LibreLinkUp / real Nightscout storage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/checkout@v5
        with:
          repository: nightscout/cgm-remote-monitor
          ref: 59430336dac0d75cdc7622725225b7ab774d788e
          path: .local/librelinkup/nightscout-src
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .local/librelinkup/nightscout-src
          load: true
          tags: librelinkup-validation-nightscout:59430336
          cache-from: type=gha,scope=librelinkup-nightscout
          cache-to: type=gha,mode=max,scope=librelinkup-nightscout
      - name: Synthetic source, REST, internal storage and plugin restart tests
        run: npm run test:librelinkup:lab -- fixture
      - name: Stop local test containers
        if: always()
        run: npm run test:librelinkup:lab -- stop
